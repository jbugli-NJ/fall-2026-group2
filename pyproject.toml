[project]
name = "monty-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jehan Bugli", email = "jehanbugli123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pystac-client>=0.9.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
monty-tool = "monty_tool:main"

[project.optional-dependencies]
test = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monty_tool"]
