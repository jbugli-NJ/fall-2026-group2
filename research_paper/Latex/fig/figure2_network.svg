<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" role="img" aria-labelledby="title desc">
  <title id="title">Event-centered Neo4j graph</title>
  <desc id="desc">Impact, verified news articles, and footprints are distinct nodes linked to a disaster Event. NASA POWER weather matches by item ID and becomes properties rather than a separate node. The Event links to hazard, country, and event day. GO appeal links to GO event, which also links to the shared country node.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .node { fill: #fff; stroke: #222; stroke-width: 1.7; }
    .event { fill: #f1f1f1; stroke-width: 2.1; }
    .edge { fill: none; stroke: #222; stroke-width: 1.8; marker-end: url(#arrow); }
    .branch { fill: none; stroke: #222; stroke-width: 1.8; }
    .property { fill: none; stroke: #222; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    .name { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #111; }
    .name-compact { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
    .eventname { font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 700; fill: #111; }
    .sub { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #222; }
    .rel { font-family: 'Courier New', Courier, monospace; font-size: 22px; fill: #111; }
    .note { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #222; }
  </style>

  <!-- The four rows make the source-to-event flow explicit. -->
  <rect class="node" x="24" y="64" width="190" height="72"/>
  <text class="name" x="40" y="94">Impact</text>
  <text class="sub" x="40" y="122">MontandonItem</text>

  <rect class="node" x="24" y="168" width="190" height="72"/>
  <text class="name" x="40" y="198">NewsArticle</text>
  <text class="sub" x="40" y="226">Media Cloud</text>

  <rect class="node" x="24" y="272" width="190" height="72"/>
  <text class="name" x="40" y="302">Footprint</text>
  <text class="sub" x="40" y="330">Spatial extent</text>

  <rect class="node" x="24" y="376" width="190" height="72"/>
  <text class="name-compact" x="40" y="406">NASA POWER</text>
  <text class="sub" x="40" y="434">Daily weather</text>

  <rect class="node event" x="400" y="64" width="236" height="384"/>
  <text class="eventname" x="422" y="235">Event</text>
  <text class="sub" x="422" y="270">MontandonItem</text>
  <text class="sub" x="422" y="300">Disaster record</text>
  <line x1="419" y1="382" x2="617" y2="382" stroke="#777" stroke-width="1"/>
  <text class="sub" x="422" y="421">Weather fields*</text>

  <text class="rel" x="235" y="92">IMPACT_OF</text>
  <path class="edge" d="M214 101 H392"/>
  <text class="rel" x="235" y="196">VERIFIED_FOR</text>
  <path class="edge" d="M214 205 H392"/>
  <text class="rel" x="235" y="300">FOOTPRINT_OF</text>
  <path class="edge" d="M214 309 H392"/>
  <text class="rel" x="218" y="404">item_id match</text>
  <path class="property" d="M214 413 H392"/>

  <!-- The event's ordinary context links fan out below it. -->
  <path class="branch" d="M518 448 V512 H109 M518 512 H551"/>
  <path class="edge" d="M109 512 V595"/>
  <path class="edge" d="M330 512 V595"/>
  <path class="edge" d="M551 512 V595"/>

  <text class="rel" x="24" y="574">HAS_HAZARD</text>
  <text class="rel" x="235" y="574">IN_COUNTRY</text>
  <text class="rel" x="470" y="574">STARTED_ON</text>

  <rect class="node" x="24" y="604" width="170" height="68"/>
  <text class="name" x="40" y="645">Hazard</text>
  <rect class="node" x="230" y="604" width="200" height="68"/>
  <text class="name" x="246" y="645">Country</text>
  <rect class="node" x="466" y="604" width="170" height="68"/>
  <text class="name" x="482" y="645">EventDay</text>

  <!-- IFRC GO records share a country, not a disaster-event identifier. -->
  <rect class="node" x="230" y="774" width="200" height="68"/>
  <text class="name" x="246" y="815">GOEvent</text>
  <rect class="node" x="466" y="774" width="170" height="68"/>
  <text class="name" x="482" y="815">GOAppeal</text>
  <path class="edge" d="M330 774 V680"/>
  <text class="rel" x="345" y="738">IN_COUNTRY</text>
  <path class="edge" d="M466 808 H438"/>
  <text class="rel" x="470" y="758">FOR_EVENT</text>

  <line x1="24" y1="863" x2="636" y2="863" stroke="#777" stroke-width="1"/>
  <text class="note" x="24" y="887">Solid arrows: graph relationships. Dashed: property match.</text>
  <text class="note" x="24" y="911">* Weather may attach to Event or Impact by item_id.</text>
  <text class="note" x="24" y="935">Shared country does not mean the same disaster.</text>
</svg>
